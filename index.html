<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<meta name="theme-color" content="#0d0e11">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Forge</title>
<style>
:root{
  --bg:#0d0e11; --s1:#15171c; --s2:#1d2027; --s3:#272b34; --line:#262a33;
  --text:#f3f4f6; --muted:#8c929e; --dim:#5c6270;
  --acc:#d6ff3d; --acc-ink:#0d0e11; --danger:#ff5f5f;
  --r:18px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
svg{width:20px;height:20px;flex:none}

/* layout */
.screen{min-height:100vh;min-height:100dvh}
.top{position:sticky;top:0;z-index:5;background:rgba(13,14,17,.88);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  padding:calc(var(--st) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;min-height:44px}
.top-mid{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.title{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.title-sm{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-sm svg{width:16px;height:16px;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.content{padding:14px 16px calc(100px + var(--sb))}
.content.has-actions{padding-bottom:calc(190px + var(--sb))}
.muted{color:var(--muted)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px;font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.section-h:first-child{margin-top:4px}
.section-h .muted{font-weight:600;letter-spacing:0;text-transform:none}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;
  background:rgba(17,19,23,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sb))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:11px;color:var(--dim);font-weight:650;text-align:center}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--acc)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;
  font-weight:700;font-size:16px;padding:0 18px;background:var(--s2);border:1px solid var(--line);white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{height:36px;font-size:14px;border-radius:11px;padding:0 12px}
.btn.dashed{background:transparent;border:1.5px dashed var(--s3);color:var(--muted);margin-top:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.iconbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);flex:none}
.iconbtn.sm{width:36px;height:36px;border-radius:11px;background:transparent;border-color:transparent;color:var(--dim)}
.iconbtn.sm svg{width:18px;height:18px}
.iconbtn.on{color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;flex-direction:column;gap:8px;
  padding:26px 16px calc(12px + var(--sb));background:linear-gradient(to top,var(--bg) 72%,rgba(13,14,17,0))}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pill{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--s3);color:var(--muted);white-space:nowrap}
.pill.live{background:rgba(214,255,61,.14);color:var(--acc)}
.cat{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}

/* calendar */
.weeknav{display:flex;align-items:center;gap:8px;margin-top:12px}
.strip{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 7px;border-radius:12px;font-size:11px;color:var(--muted);font-weight:650}
.sd b{font-size:16px;color:var(--text);font-weight:750}
.sd i{width:5px;height:5px;border-radius:50%;background:transparent}
.sd i.has{background:var(--acc)}
.sd.today{background:var(--acc);color:var(--acc-ink)}
.sd.today b{color:var(--acc-ink)}
.sd.today i.has{background:var(--acc-ink)}
.weekstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.ws{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.ws b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.ws span{font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.resume{display:flex;align-items:center;gap:12px;width:100%;background:linear-gradient(135deg,rgba(214,255,61,.16),rgba(214,255,61,.04));border:1px solid rgba(214,255,61,.35);border-radius:var(--r);padding:14px;margin-bottom:14px}
.resume .rt{flex:1;min-width:0}
.resume .rt b{display:block;font-size:16px}
.resume .rt span{font-size:13px;color:var(--muted)}
.resume .go{color:var(--acc);font-weight:800;display:flex;align-items:center;gap:2px}
.day{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;scroll-margin-top:190px}
.day.today{border-color:rgba(214,255,61,.45);box-shadow:0 0 0 1px rgba(214,255,61,.12) inset}
.day-head{display:flex;align-items:center;gap:10px}
.day-head .dl{flex:1;display:flex;align-items:baseline;gap:8px}
.dow{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);width:34px}
.day.today .dow{color:var(--acc)}
.dnum{font-size:20px;font-weight:800}
.dnum span{font-size:13px;color:var(--muted);font-weight:650;margin-left:2px}
.empty-day{color:var(--dim);font-size:14px;padding:8px 2px 2px 44px}
.wklist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.wk{display:flex;align-items:center;gap:12px;width:100%;background:var(--s2);border-radius:13px;padding:11px 12px 11px 0;overflow:hidden;color:var(--text)}
.wk-bar{width:4px;align-self:stretch;border-radius:0 4px 4px 0}
.wk-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wk-name{font-weight:750;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-meta{font-size:13px;color:var(--muted)}
.wk svg{color:var(--dim)}

/* slots / exercise cards */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:15px;padding:4px 4px 4px 0}
.slot-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 4px 8px 12px}
.slot-main>svg{color:var(--dim)}
.idx{width:30px;height:30px;border-radius:10px;background:var(--s2);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.idx svg{width:16px;height:16px}
.slot-txt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.slot-ex{font-weight:700;font-size:16px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.empty .slot-ex{color:var(--dim);font-weight:600}
.slot-sum{font-size:13px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tagrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ex-card{display:flex;align-items:center;gap:12px;width:100%;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px}
.ex-card>svg{color:var(--dim)}
.ex-card.next{border-color:var(--acc);background:linear-gradient(135deg,rgba(214,255,61,.10),rgba(214,255,61,.02))}
.ex-card.next .idx{background:var(--acc);color:var(--acc-ink)}
.ex-card.done .idx{background:rgba(214,255,61,.14);color:var(--acc)}
.pill.next{background:var(--acc);color:var(--acc-ink)}
.progress{height:6px;background:var(--s2);border-radius:99px;overflow:hidden;margin:4px 0 6px}
.progress i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.mini-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:12px}

/* builder */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:9px 12px 9px 10px;border-radius:12px;font-weight:700;font-size:14px;background:var(--s1);border:1px solid var(--line)}
.chip svg{width:16px;height:16px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.brow{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:8px 6px 8px 10px}
.brow .grow{flex:1;min-width:0}
.hint{color:var(--muted);font-size:14px;line-height:1.45;margin:0 2px 14px}
.empty{text-align:center;color:var(--muted);padding:36px 20px;border:1.5px dashed var(--s3);border-radius:var(--r);font-size:15px;line-height:1.5}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

/* fields */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;font-weight:650}
.date-inp{-webkit-appearance:none;appearance:none;background:var(--s2);border:1px solid var(--line);border-radius:10px;height:38px;padding:0 10px;color:var(--text);font-weight:700;min-width:150px;text-align:center}
.text-inp{width:100%;height:50px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:0 14px;outline:none}
.text-inp:focus,.inp:focus,textarea:focus{border-color:var(--acc)}
textarea.note{width:100%;min-height:70px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;resize:vertical}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:14px;top:15px;color:var(--dim)}
.search input{padding-left:42px}
.seg{display:inline-flex;background:var(--s2);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:7px 16px;border-radius:9px;font-weight:750;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}

/* logging */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats.one{grid-template-columns:1fr}
.stat{background:var(--s2);border-radius:13px;padding:11px 12px}
.stat-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}
.stat-v{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat-v.none{color:var(--dim)}
.stat-s{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.last{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.4}
.last b{color:var(--text);font-weight:650}
.sets{display:flex;flex-direction:column;gap:8px}
.sethead,.setrow{display:grid;grid-template-columns:30px 1fr 1fr 36px;gap:8px;align-items:center}
.sethead{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:0 0 2px}
.sethead span{text-align:center}
.setno{width:30px;height:30px;border-radius:10px;background:var(--s2);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.setno.f{background:rgba(214,255,61,.14);color:var(--acc)}
.inp{width:100%;height:50px;background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:0 10px;text-align:center;font-weight:750;font-size:18px;outline:none;font-variant-numeric:tabular-nums}
.inp::placeholder{color:#454a55;font-weight:650}
.drv{font-size:12px;color:var(--muted);text-align:right;margin:-3px 44px 2px 0;font-variant-numeric:tabular-nums;min-height:15px}
.drv b{color:var(--acc);font-weight:750}

/* lists */
.list{display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 14px;min-height:52px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .lmain{flex:1;min-width:0;padding:10px 0;display:flex;flex-direction:column;gap:2px}
.li .lname{font-weight:650;font-size:16px}
.li .lsub{font-size:12.5px;color:var(--muted)}
.li .check{color:var(--acc)}
.li>svg{color:var(--dim)}
.exgroup{margin-bottom:16px}
.gh{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.gh .dot{width:9px;height:9px;border-radius:50%}
.star{color:var(--dim)}
.star.on{color:var(--acc)}

/* templates */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{display:flex;flex-direction:column;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:13px;min-height:96px;text-align:left;width:100%;position:relative}
.tcard b{font-size:16px;font-weight:800}
.tcard span.ts{font-size:12.5px;color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.dots i{width:8px;height:8px;border-radius:50%}
.trow{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:4px 4px 4px 0;margin-bottom:8px}
.trow .tmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:10px 0 10px 14px;text-align:left}
.trow .tmain b{font-size:16px}
.trow .tmain span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* records */
.rec{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.rec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rec-h .rn{flex:1;min-width:0;text-align:left}
.rec-h .rn b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#16181d;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:8px 16px calc(18px + var(--sb))}
.sheet.enter{animation:up .26s cubic-bezier(.2,.9,.3,1)}
.backdrop.enter{animation:fade .2s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{width:38px;height:5px;border-radius:9px;background:var(--s3);margin:2px auto 12px}
.sheet h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sheet .sh-sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.sheet .stack{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.custom-box{display:flex;gap:8px;margin-top:10px}

/* toast */
#toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translate(-50%,-140%);z-index:50;background:var(--text);color:var(--bg);
  font-weight:750;font-size:14px;padding:11px 16px;border-radius:999px;transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:90vw;text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0)}
@media (min-width:700px){
  .content,.top>*{max-width:640px;margin-left:auto;margin-right:auto}
  .sheet{max-width:640px;margin:0 auto}
  .actionbar{align-items:center}.actionbar>*{width:100%;max-width:608px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast"></div>
<script>
(function(){
'use strict';

/* ---------- constants ---------- */
var STORE_KEY = 'forge-fitness-v1';
var CATS = ['Press','Pull','Accessory Upper','Major Lower','Secondary Lower','Accessory Lower','Core','Exit Ticket','Cardio'];
var CAT_COLOR = {'Press':'#ff7a45','Pull':'#4da3ff','Accessory Upper':'#b58cff','Major Lower':'#ff4d6d','Secondary Lower':'#ffb547',
  'Accessory Lower':'#f2d33f','Core':'#3ddc97','Exit Ticket':'#ff5fd2','Cardio':'#2fd6e8'};
var LIB = {
  'Press':['Flat DB Bench','Incline DB Bench','DB Shoulder Press','Flat Bench Press','Incline Bench Press','Flat Smith Machine Press','Incline Smith Machine Press','Machine Chest Press','Machine Incline Chest Press'],
  'Pull':['Pull-Ups','Chin-Ups','Neutral Grip Pull-Ups','Machine Row','DB Chest Supported Row','Cable Row','Barbell Row','T-Bar Row','Lat Pulldown'],
  'Accessory Upper':['Cable Overhead Tricep Extensions','Smith JM Press','Skull Crushers','Cable Pushdowns','Machine Dips/Pushdowns','Machine Tricep Extensions','DB Bicep Curls','BB Bicep Curls','Machine Curls','Machine Concentration Curls','Bayesian Cable Curls','Reverse BB Curls','Reverse Cable Curls','DB Hammer Curls','Cable Hammer Curls','Machine Lateral Raises','Cable Lateral Raises','DB Lateral Raises','Cable Reverse Flies','Reverse Pec Deck','Pec Deck','Cable Flies','Dips','Wrist Curls','Wrist Extensions'],
  'Major Lower':['BB Back Squat','Hack Squat','Deadlift','RDL','DB Bulgarians','BB Bulgarians'],
  'Secondary Lower':['Leg Extensions','Hamstring Curls','DB RDLs','Glute Bridges'],
  'Accessory Lower':['Calf Raises','Hip Abduction','Hip Adduction','Hip Flexor Raises','Tibialis Raises'],
  'Core':['Cable Rotations','Isometric Cable Holds','Russian Twists','Hanging Leg Raises','Roman Chair Leg Raises','Machine Crunch','Ab Roller'],
  'Exit Ticket':['1000m Row Erg','1000m Ski Erg','30 Burpees','50 Wall Balls','~50m Sled Push','~50m Sled Pull','30 Weighted Lunges','Max Grip Timer'],
  'Cardio':['Outdoor Run','Indoor Run','Swim','Outdoor Bike','Indoor Bike','Elliptical','Stepper','Walk','Hike']
};
var HOLDS = {'Isometric Cable Holds':1,'Max Grip Timer':1};
var PREBUILT = {
  full:{name:'Full Body',slots:['Press','Pull','Accessory Upper','Accessory Upper','Major Lower','Secondary Lower','Accessory Lower','Core','Exit Ticket']},
  upper:{name:'Upper',slots:['Press','Pull','Pull','Accessory Upper','Accessory Upper','Accessory Upper','Core','Exit Ticket']},
  lower:{name:'Lower',slots:['Major Lower','Secondary Lower','Secondary Lower','Accessory Lower','Accessory Lower','Core','Exit Ticket']},
  cardio:{name:'Cardio Day',slots:['Cardio']}
};
var MAX_FAVS = 10;
var DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ---------- icons ---------- */
function svg(p, fill){ return '<svg viewBox="0 0 24 24" fill="'+(fill?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'; }
var I = {
  cal: svg('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  dumb: svg('<path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/>'),
  list: svg('<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>'),

/* ---------- helpers ---------- */
function pad(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYmd(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function today(){ return ymd(new Date()); }
function dowIdx(d){ return (d.getDay()+6)%7; }
function fmtMD(s){ var d=parseYmd(s); return MON[d.getMonth()]+' '+d.getDate(); }
function fmtLong(s){ var d=parseYmd(s); return DOW[dowIdx(d)]+', '+MON[d.getMonth()]+' '+d.getDate()+(d.getFullYear()!==new Date().getFullYear()?', '+d.getFullYear():''); }
function weekLabel(ws){ var we=addDays(ws,6);
  return ws.getMonth()===we.getMonth() ? MON[ws.getMonth()]+' '+ws.getDate()+' – '+we.getDate() : MON[ws.getMonth()]+' '+ws.getDate()+' – '+MON[we.getMonth()]+' '+we.getDate(); }
function cutoff(){ var d=new Date(); d.setMonth(d.getMonth()-2); return ymd(d); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ if(v==null) return null; var s=String(v).trim().replace(',','.'); if(!s) return null; var n=parseFloat(s); return isFinite(n)?n:null; }
function trimN(n){ return Math.round(n*100)/100; }
function hexA(h,a){ var n=parseInt(h.slice(1),16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'; }
// time fields accept "25:30", "25.30", "1:05:00" or a bare number (minutes, or seconds for holds)
function parseTime(v, bare){
  var s=String(v==null?'':v).trim(); if(!s) return null;
  var parts=s.split(/[:.]/);
  if(parts.length===1){ var n=num(s); if(n==null) return null; return Math.round(bare==='sec'?n:n*60); }
  if(parts.length>3) return null;
  var nums=parts.map(function(p){ return p===''?0:Number(p); });
  if(nums.some(function(n){return !isFinite(n)||n<0;})) return null;
  return parts.length===2 ? nums[0]*60+nums[1] : nums[0]*3600+nums[1]*60+nums[2];
}
function fmtTime(sec){ sec=Math.round(sec); var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h ? h+':'+pad(m)+':'+pad(s) : m+':'+pad(s); }

/* ---------- state ---------- */
function blankState(){ return {v:1, workouts:[], templates:[], favs:[], customEx:[], unit:'lb'}; }
function load(){
  try{ var raw=localStorage.getItem(STORE_KEY); if(raw){ var s=JSON.parse(raw), b=blankState();
    for(var k in b){ if(s[k]===undefined) s[k]=b[k]; } return s; } }catch(e){}
  return blankState();
}
var state = load();
var saveWarned=false, saveTimer=null;
function save(){ clearTimeout(saveTimer); try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ if(!saveWarned){ saveWarned=true; toast("Couldn't save – storage unavailable"); } } }
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,300); }
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', function(){ if(document.hidden) save(); });

function catOf(ex){
  for(var i=0;i<state.customEx.length;i++) if(state.customEx[i].name===ex) return state.customEx[i].cat;
  for(var c in LIB) if(LIB[c].indexOf(ex)>-1) return c;
  return null;
}
function metricOf(ex, cat){
  if(!ex) return 'strength';
  for(var i=0;i<state.customEx.length;i++) if(state.customEx[i].name===ex) return state.customEx[i].metric;
  if(HOLDS[ex]) return 'hold';
  var c = catOf(ex) || cat;
  if(c==='Cardio') return 'cardio';
  if(c==='Exit Ticket') return 'timed';
  return 'strength';
}
function defaultMetric(cat){ return cat==='Cardio'?'cardio':cat==='Exit Ticket'?'timed':'strength'; }
function exercisesFor(cat){ return LIB[cat].concat(state.customEx.filter(function(e){return e.cat===cat;}).map(function(e){return e.name;})); }
function defaultSets(m){
  if(m==='cardio') return [{d:'',t:''}];
  if(m==='timed') return [{w:'',t:''}];
  if(m==='hold') return [{w:'',t:''},{w:'',t:''}];
  return [{w:'',r:''},{w:'',r:''}];
}
function blankSet(m){ return m==='cardio'?{d:'',t:''}:(m==='timed'||m==='hold')?{w:'',t:''}:{w:'',r:''}; }
function newSlot(cat, ex){ return {id:uid(), cat:cat, ex:ex||null, sets: ex?defaultSets(metricOf(ex,cat)):[], note:''}; }
function filled(st){ for(var k in st){ if(String(st[k]==null?'':st[k]).trim()!=='') return true; } return false; }
function slotHasData(s){ return !!s.ex && s.sets.some(filled); }
function getW(id){ for(var i=0;i<state.workouts.length;i++) if(state.workouts[i].id===id) return state.workouts[i]; return null; }
function slotOf(w,id){ if(!w) return null; for(var i=0;i<w.slots.length;i++) if(w.slots[i].id===id) return w.slots[i]; return null; }
function unit(){ return state.unit; }
function fmtW(w){ return (w==null||w===0) ? 'BW' : trimN(w)+' '+unit(); }

function setText(st, m){
  if(m==='strength'){ var w=num(st.w); return (w?trimN(w):'BW')+'×'+(num(st.r)||0); }
  if(m==='cardio'){ var d=num(st.d), t=parseTime(st.t,'min'); return [d!=null?trimN(d)+' km':null, t?fmtTime(t):null].filter(Boolean).join(' in '); }
  var tt=parseTime(st.t, m==='hold'?'sec':'min'), ww=num(st.w);
  return [tt?fmtTime(tt):null, ww?'@ '+trimN(ww):null].filter(Boolean).join(' ');
}
function setSummary(s){
  var m=metricOf(s.ex,s.cat), f=s.sets.filter(filled);
  var parts=f.slice(0,4).map(function(st){return setText(st,m);});
  return parts.join(', ')+(f.length>4?' +'+(f.length-4):'');
}

/* records within the last 2 months (logged workouts only) */
function records(ex, excludeId){
  var m=metricOf(ex), cut=cutoff(), r={metric:m};
  state.workouts.forEach(function(w){
    if(w.status!=='logged'||w.id===excludeId||w.date<cut) return;
    w.slots.forEach(function(s){
      if(s.ex!==ex) return;
      s.sets.forEach(function(st){
        if(m==='strength'){
          var reps=num(st.r); if(!reps||reps<1) return; var wt=num(st.w)||0;
          var better=function(b){ return !b||wt>b.w||(wt===b.w&&reps>b.r); };
          if(better(r.one)) r.one={w:wt,r:reps,date:w.date};
          if(reps>=5&&better(r.five)) r.five={w:wt,r:reps,date:w.date};
        } else if(m==='cardio'){
          var d=num(st.d), t=parseTime(st.t,'min'); if(!d||d<1||!t) return;
          var p=t/d; if(!r.pace||p<r.pace.p) r.pace={p:p,d:d,t:t,date:w.date};
        } else {
          var tt=parseTime(st.t, m==='hold'?'sec':'min'); if(!tt) return;
          if(!r.time||(m==='hold'?tt>r.time.t:tt<r.time.t)) r.time={t:tt,w:num(st.w),date:w.date};
        }
      });
    });
  });
  return r;
}
function stat(label, val, sub){
  return '<div class="stat"><div class="stat-l">'+label+'</div><div class="stat-v'+(val==='—'?' none':'')+'">'+val+'</div><div class="stat-s">'+(sub||'&nbsp;')+'</div></div>';
}
function recordStats(ex, excludeId){
  var r=records(ex,excludeId);
  if(r.metric==='strength'){
    return '<div class="stats">'+
      stat('Heaviest · 5+ reps', r.five?fmtW(r.five.w):'—', r.five?'× '+r.five.r+' · '+fmtMD(r.five.date):'')+
      stat('Heaviest · 1+ rep', r.one?fmtW(r.one.w):'—', r.one?'× '+r.one.r+' · '+fmtMD(r.one.date):'')+'</div>';
  }
  if(r.metric==='cardio'){
    return '<div class="stats one">'+stat('Fastest km', r.pace?fmtTime(r.pace.p)+' /km':'—',
      r.pace?trimN(r.pace.d)+' km in '+fmtTime(r.pace.t)+' · '+fmtMD(r.pace.date):'Log a session of 1 km or more')+'</div>';
  }
  var lbl = r.metric==='hold'?'Longest hold':'Best time';
  return '<div class="stats one">'+stat(lbl, r.time?fmtTime(r.time.t):'—',
    r.time?(r.time.w?fmtW(r.time.w)+' · ':'')+fmtMD(r.time.date):'')+'</div>';
}
function lastSession(ex, excludeId){
  var best=null;
  state.workouts.forEach(function(w){
    if(w.status!=='logged'||w.id===excludeId) return;
    w.slots.forEach(function(s){
      if(s.ex===ex && s.sets.some(filled)){
        if(!best || w.date>best.w.date || (w.date===best.w.date && (w.created||0)>(best.w.created||0))) best={w:w,slot:s};
      }
    });
  });
  return best;
}

}
function pop(){

}
function replaceTop(entry){ ui.stack.pop(); ui.stack.push(entry); render(); window.scrollTo(0,0); }

/* calendar */
function renderCalendar(){

  var weekW=state.workouts.filter(function(w){ return w.status==='logged'&&w.date>=first&&w.date<=last; });
  var sets=0, km=0;
  weekW.forEach(function(w){ w.slots.forEach(function(s){ var m=metricOf(s.ex,s.cat); s.sets.forEach(function(st){ if(filled(st)){ if(m==='cardio') km+=num(st.d)||0; else sets++; } }); }); });
  var active=state.workouts.filter(function(w){return w.status==='active';}).sort(function(a,b){return (b.created||0)-(a.created||0);});

  var h='<header class="top"><div class="top-row"><div class="top-mid"><div class="eyebrow">'+(thisWeek?'This week':ws.getFullYear())+'</div><div class="title">'+weekLabel(ws)+'</div></div>'+

    '</div><button class="iconbtn sm" data-a="wk-next" aria-label="Next week">'+I.right+'</button></div></header>';

  h+='<main class="content">';

    h+='<button class="resume" data-a="open-wk" data-id="'+w.id+'"><span class="pill live">Live</span><span class="rt"><b>'+esc(w.name)+'</b><span>'+fmtLong(w.date)+' · in progress</span></span><span class="go">Resume'+I.right+'</span></button>';
  });
  h+='<div class="weekstats"><div class="ws"><b>'+weekW.length+'</b><span>Workouts</span></div><div class="ws"><b>'+sets+'</b><span>Sets</span></div><div class="ws"><b>'+trimN(km)+'</b><span>Km</span></div></div>';

      (s===td?'<span class="pill live">Today</span>':'')+
      '<button class="btn sm" data-a="add" data-d="'+s+'">'+I.plus+'Add</button></div>';
    if(list.length) h+='<div class="wklist">'+list.map(wkItem).join('')+'</div>';
    else h+='<div class="empty-day">'+(s<td?'Rest day':'Nothing planned')+'</div>';
    h+='</section>';
  });
  return h+'</main>';

function wkItem(w){
  var cats=[]; w.slots.forEach(function(s){ if(cats.indexOf(s.cat)<0) cats.push(s.cat); });
  var cols=cats.map(function(c){return CAT_COLOR[c];}); if(!cols.length) cols=['#555'];

  var done=w.slots.filter(slotHasData).length, sets=0, km=0;
  w.slots.forEach(function(s){ var m=metricOf(s.ex,s.cat); s.sets.forEach(function(st){ if(filled(st)){ if(m==='cardio') km+=num(st.d)||0; else sets++; } }); });
  var meta=[done+'/'+w.slots.length+' exercises', sets?sets+' sets':null, km?trimN(km)+' km':null].filter(Boolean).join(' · ');
  return '<button class="wk" data-a="open-wk" data-id="'+w.id+'"><span class="wk-bar" style="background:'+bar+'"></span><span class="wk-main"><span class="wk-name">'+esc(w.name)+'</span><span class="wk-meta">'+meta+'</span></span>'+

/* log an exercise */
function colsFor(m){
  var u=unit();
  if(m==='cardio') return [['d','Distance (km)','decimal'],['t','Time (m:ss)','decimal']];
  if(m==='timed') return [['w','Weight ('+u+')','decimal'],['t','Time (m:ss)','decimal']];
  if(m==='hold') return [['w','Weight ('+u+')','decimal'],['t','Time (sec)','decimal']];
  return [['w','Weight ('+u+')','decimal'],['r','Reps','numeric']];
}
function derived(st, m){
  if(m==='cardio'){ var d=num(st.d), t=parseTime(st.t,'min'); if(d&&t) return fmtTime(t)+' · <b>'+fmtTime(t/d)+' /km</b>'; if(t) return fmtTime(t); return ''; }
  if(m==='timed'||m==='hold'){ var tt=parseTime(st.t, m==='hold'?'sec':'min'); return tt?'<b>'+fmtTime(tt)+'</b>':''; }
  return '';
}
function renderLog(t){
  var w=getW(t.id), s=slotOf(w,t.slot); if(!s||!s.ex) return null;
  var m=metricOf(s.ex,s.cat), cols=colsFor(m), last=lastSession(s.ex,w.id), ls=last?last.slot.sets:[];
  var next=null; for(var i=0;i<w.slots.length;i++){ var x=w.slots[i]; if(x.id!==s.id&&!slotHasData(x)){ next=x; break; } }
  var h='<div class="screen"><header class="top"><div class="top-row"><button class="iconbtn" data-a="back" aria-label="Back to workout">'+I.left+'</button><div class="top-mid"><div class="eyebrow">'+esc(w.name)+'</div><div class="title-sm">'+esc(s.ex)+'</div></div><button class="btn sm" data-a="log-change">Change</button></div></header><main class="content">';
  h+='<div class="card">'+recordStats(s.ex, w.id);
  if(last) h+='<div class="last">Last time ('+fmtMD(last.w.date)+'): <b>'+esc(setSummary(last.slot))+'</b></div>';
  h+='</div><div class="section-h"><span>'+(m==='cardio'?'Entries':'Sets')+'</span>'+catTag(s.cat)+'</div><div class="sets">';
  h+='<div class="sethead"><span></span><span>'+cols[0][1]+'</span><span>'+cols[1][1]+'</span><span></span></div>';
  s.sets.forEach(function(st,i){
    var ph=ls[i]||{};
    h+='<div class="setrow"><span class="setno'+(filled(st)?' f':'')+'" id="sn-'+i+'">'+(i+1)+'</span>'+
      cols.map(function(c){ return '<input class="inp" inputmode="'+c[2]+'" autocomplete="off" data-in="set" data-i="'+i+'" data-k="'+c[0]+'" value="'+esc(st[c[0]])+'" placeholder="'+esc(ph[c[0]]||(c[0]==='w'&&m==='strength'?'0':'–'))+'">'; }).join('')+
      '<button class="iconbtn sm" data-a="log-rmset" data-i="'+i+'" aria-label="Delete set">'+I.x+'</button></div>';
    if(m!=='strength') h+='<div class="drv" id="drv-'+i+'">'+derived(st,m)+'</div>';
  });
  h+='</div><button class="btn block dashed" data-a="log-addset">'+I.plus+'Add '+(m==='cardio'?'entry':'set')+'</button>';
  if(m==='strength') h+='<p class="hint" style="margin-top:10px;font-size:13px">Grey numbers are from last time. Leave weight blank or 0 for bodyweight.</p>';
  else h+='<p class="hint" style="margin-top:10px;font-size:13px">Type time as 25:30 or 25.30'+(m==='hold'?', or just seconds (45).':', or just minutes (25).')+'</p>';
  h+='<div class="section-h"><span>Notes</span></div><textarea class="note" data-in="note" placeholder="Seat height, grip, how it felt…">'+esc(s.note||'')+'</textarea>';
  h+='<div class="stack" style="display:flex;flex-direction:column;gap:8px;margin-top:18px">';
  if(next) h+='<button class="btn primary block" data-a="log-next" data-id="'+next.id+'">Next: '+esc(next.ex||next.cat)+I.right+'</button>';
  h+='<button class="btn'+(next?'':' primary')+' block" data-a="back">'+I.left+'Back to workout</button></div>';
  return h+'</main></div>';
}

/* ---------- actions ---------- */
function draftFromSlots(date, name, source, slots, templateId){
  ui.draft={date:date, name:name, source:source, templateId:templateId||null, slots:slots.map(function(s){ return {id:uid(), cat:s.cat, ex:s.ex||null}; })};
}
function openPicker(cat, target, current){ openSheet({type:'picker', cat:cat, target:target, current:current||null}); }
function applyPick(ex){
  var s=ui.sheet, t=s.target; closeSheet();
  if(t.kind==='draft'){
    var sl=null; ui.draft.slots.forEach(function(x){ if(x.id===t.slot) sl=x; });
    if(sl) sl.ex=ex; render(); return;
  }
  var w=getW(t.wid), slot=slotOf(w,t.slot); if(!slot) return;
  var oldM=slot.ex?metricOf(slot.ex,slot.cat):null, newM=metricOf(ex,slot.cat);
  slot.ex=ex;
  if(!slot.sets.length||oldM!==newM) slot.sets=defaultSets(newM);
  save();
  if(t.open){ if(top()&&top().v==='log') replaceTop({v:'log', id:w.id, slot:slot.id}); else push({v:'log', id:w.id, slot:slot.id}); }
  else render();
}
function beginWorkout(){
  var d=ui.draft;
  var w={id:uid(), date:d.date, name:d.name, status:'active', created:Date.now(), templateId:d.templateId||null,
    slots:d.slots.map(function(s){ return newSlot(s.cat, s.ex); })};
  state.workouts.push(w); save(); ui.draft=null;
  ui.stack=[{v:'session', id:w.id}]; render(); window.scrollTo(0,0);
}
function saveTemplate(name, slots, existingId){
  var t=existingId&&state.templates.filter(function(x){return x.id===existingId;})[0];
  if(!t) t=state.templates.filter(function(x){return x.name.toLowerCase()===name.toLowerCase();})[0];
  var clean=slots.map(function(s){return {cat:s.cat, ex:s.ex||null};});
  if(t){ t.name=name; t.slots=clean; t.updated=Date.now(); toast('Saved “'+name+'”'); }
  else { t={id:uid(), name:name, slots:clean, created:Date.now()}; state.templates.push(t); toast('Added to My workouts'); }
  save(); return t;
}
function finishWorkout(w){
  w.status='logged'; w.finished=Date.now(); save();
  ui.weekStart=mondayOf(parseYmd(w.date));
  home('calendar'); toast('Workout logged 💪');
  setTimeout(function(){ var el=document.getElementById('d-'+w.date); if(el) el.scrollIntoView({block:'start'}); },30);
}

  var data=JSON.stringify(state), name='forge-backup-'+today()+'.json';
  try{
    var file=new File([data], name, {type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ navigator.share({files:[file], title:'Forge backup'}).catch(function(){}); return; }
    var a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ toast('Export failed – try Copy instead'); }
}
function importData(text){
  try{
    var s=JSON.parse(text); if(!s||!Array.isArray(s.workouts)) throw 0;
    confirmSheet({title:'Replace your data?', msg:'This replaces everything on this device with the backup ('+s.workouts.length+' workouts).', ok:'Import', danger:true}, function(){
      var b=blankState(); for(var k in b){ if(s[k]===undefined) s[k]=b[k]; } state=s; save(); home('calendar'); toast('Backup imported');
    });
  }catch(e){ toast("That doesn't look like a Forge backup"); }
}

var A = {
  'tab': function(el){ if(ui.tab===el.dataset.t) { window.scrollTo({top:0,behavior:'smooth'}); return; } ui.tabScroll[ui.tab]=window.scrollY; ui.tab=el.dataset.t; render(); window.scrollTo(0, ui.tabScroll[ui.tab]||0); },
  'back': function(){ pop(); },
  'settings': function(){ push({v:'settings'}); },
  'sheet-close': function(){ closeSheet(); },
  'wk-prev': function(){ ui.weekStart=addDays(ui.weekStart,-7); render(); },
  'wk-next': function(){ ui.weekStart=addDays(ui.weekStart,7); render(); },
  'wk-today': function(){ ui.weekStart=mondayOf(new Date()); render(); var el=document.getElementById('d-'+today()); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },
  'jump': function(el){ var t=document.getElementById('d-'+el.dataset.d); if(t) t.scrollIntoView({behavior:'smooth', block:'start'}); },
  'add': function(el){ openSheet({type:'add', date:el.dataset.d}); },
  'pick-prebuilt': function(el){ var p=PREBUILT[el.dataset.k]; closeSheet();
    draftFromSlots(el.dataset.d, p.name, 'prebuilt', p.slots.map(function(c){return {cat:c};})); push({v:'setup'}); },
  'pick-template': function(el){ var t=state.templates.filter(function(x){return x.id===el.dataset.id;})[0]; if(!t) return; closeSheet();
    draftFromSlots(el.dataset.d, t.name, 'template', t.slots, t.id); push({v:'setup'}); },
  'blank': function(el){ closeSheet(); ui.draft={date:el.dataset.d, cats:[]}; push({v:'builder'}); },
  /* builder */
  'b-add': function(el){ ui.draft.cats.push(el.dataset.c); render(); },
  'b-rm': function(el){ ui.draft.cats.splice(+el.dataset.i,1); render(); },
  'b-up': function(el){ var i=+el.dataset.i, c=ui.draft.cats; if(i>0){ var t=c[i-1]; c[i-1]=c[i]; c[i]=t; } render(); },
  'b-down': function(el){ var i=+el.dataset.i, c=ui.draft.cats; if(i<c.length-1){ var t=c[i+1]; c[i+1]=c[i]; c[i]=t; } render(); },
  'b-done': function(){
    if(!ui.draft.cats.length) return;
    askName({title:'Name your workout', placeholder:'e.g. Push Day', ok:'Continue'}, function(name){
      var d=ui.draft; draftFromSlots(d.date||today(), name, 'custom', d.cats.map(function(c){return {cat:c};}));
      closeSheet(); replaceTop({v:'setup'});
    });
  },
  /* setup */
  's-slot': function(el){ var sl=ui.draft.slots.filter(function(x){return x.id===el.dataset.id;})[0]; if(sl) openPicker(sl.cat, {kind:'draft', slot:sl.id}, sl.ex); },
  's-rm': function(el){ ui.draft.slots=ui.draft.slots.filter(function(x){return x.id!==el.dataset.id;}); render(); },
  's-addslot': function(){ openSheet({type:'addslot', target:'draft'}); },
  's-rename': function(){ askName({title:'Rename workout', value:ui.draft.name, ok:'Save'}, function(n){ ui.draft.name=n; closeSheet(); render(); }); },
  's-begin': function(){ beginWorkout(); },
  's-save': function(){
    var d=ui.draft;
    var doSave=function(name){ var t=saveTemplate(name, d.slots, d.templateId); d.templateId=t.id; d.source='template'; d.name=name; closeSheet(); render(); };
    if(d.source==='template'&&d.templateId) doSave(d.name);
    else askName({title:'Save template', sub:'Saved workouts appear when you add a workout to any day.', value:d.source==='prebuilt'?'My '+d.name:d.name, ok:'Save'}, doSave);
  },
  's-exit': function(){ home(); },
  /* session */
  'open-wk': function(el){ push({v:'session', id:el.dataset.id}); },
  'sess-slot': function(el){
    var t=top(), w=getW(t.id), s=slotOf(w, el.dataset.id); if(!s) return;
    if(!s.ex) openPicker(s.cat, {kind:'session', wid:w.id, slot:s.id, open:true});
    else push({v:'log', id:w.id, slot:s.id});
  },
  'sess-addslot': function(){ openSheet({type:'addslot', target:'session'}); },
  'addslot-cat': function(el){
    var c=el.dataset.c, target=ui.sheet.target;
    if(target==='draft'){ var ns={id:uid(), cat:c, ex:null}; ui.draft.slots.push(ns); render(); openPicker(c, {kind:'draft', slot:ns.id}); }
    else { var w=getW(top().id), s=newSlot(c,null); w.slots.push(s); save(); render(); openPicker(c, {kind:'session', wid:w.id, slot:s.id, open:true}); }
  },
  'sess-finish': function(){
    var w=getW(top().id);
    if(!w.slots.some(slotHasData)) confirmSheet({title:'Nothing logged yet', msg:'You haven’t entered any sets. Log this workout anyway?', ok:'Log workout'}, function(){ closeSheet(); finishWorkout(w); });
    else finishWorkout(w);
  },
  'wk-menu': function(el){ openSheet({type:'wkmenu', id:el.dataset.id}); },
  'wkm-rename': function(){ var w=getW(ui.sheet.id); askName({title:'Rename workout', value:w.name, ok:'Save'}, function(n){ w.name=n; save(); closeSheet(); render(); }); },
  'wkm-repeat': function(){ var w=getW(ui.sheet.id); closeSheet();
    draftFromSlots(today(), w.name, w.templateId?'template':'repeat', w.slots, w.templateId); push({v:'setup'}); },
  'wkm-save': function(){ var w=getW(ui.sheet.id); askName({title:'Save as template', value:w.name, ok:'Save'}, function(n){ var t=saveTemplate(n, w.slots, null); w.templateId=t.id; save(); closeSheet(); }); },
  'wkm-delete': function(){ var id=ui.sheet.id; confirmSheet({title:'Delete workout?', msg:'This can’t be undone.', ok:'Delete', danger:true}, function(){
    state.workouts=state.workouts.filter(function(w){return w.id!==id;}); save(); closeSheet();
    ui.stack=ui.stack.filter(function(e){ return !((e.v==='session'||e.v==='log')&&e.id===id); }); render(); toast('Workout deleted'); }); },
  /* log */
  'log-change': function(){ var t=top(), w=getW(t.id), s=slotOf(w,t.slot); openPicker(s.cat, {kind:'session', wid:w.id, slot:s.id, open:true}, s.ex); },
  'log-addset': function(){ var t=top(), s=slotOf(getW(t.id),t.slot), m=metricOf(s.ex,s.cat);
    var lastSet=s.sets[s.sets.length-1], ns=blankSet(m);
    if(lastSet&&m!=='cardio'&&lastSet.w) ns.w=lastSet.w; // carry weight forward
    s.sets.push(ns); save(); render(); },
  'log-rmset': function(el){ var t=top(), s=slotOf(getW(t.id),t.slot); s.sets.splice(+el.dataset.i,1); save(); render(); },
  'log-next': function(el){ var t=top(), w=getW(t.id), s=slotOf(w, el.dataset.id); if(!s) return;
    if(!s.ex){ pop(); openPicker(s.cat, {kind:'session', wid:w.id, slot:s.id, open:true}); }
    else replaceTop({v:'log', id:w.id, slot:s.id}); },
  /* picker */
  'pick-ex': function(el){ applyPick(el.dataset.ex); },
  'pick-custom': function(){ ui.sheet.custom=true; renderSheet(); },
  'pick-custom-add': function(){
    var inp=document.getElementById('custom-name'), name=(inp&&inp.value||'').trim(); if(!name) return;
    var cat=ui.sheet.cat, existing=exercisesFor(cat).filter(function(e){return e.toLowerCase()===name.toLowerCase();})[0];
    if(existing){ applyPick(existing); return; }
    if(catOf(name)){ toast('That name is used in another category'); return; }
    state.customEx.push({name:name, cat:cat, metric:defaultMetric(cat)}); save(); applyPick(name);
  },
  /* generic sheets */
  'name-ok': function(){ var v=(document.getElementById('name-inp').value||'').trim(); if(!v){ toast('Please enter a name'); return; } ui.sheet.cb(v); },
  'confirm-ok': function(){ var cb=ui.sheet.cb; closeSheet(); cb(); },
  /* templates */
  'tpl-menu': function(el){ openSheet({type:'tplmenu', id:el.dataset.id}); },
  'tpl-rename': function(){ var t=state.templates.filter(function(x){return x.id===ui.sheet.id;})[0];
    askName({title:'Rename', value:t.name, ok:'Save'}, function(n){ t.name=n; save(); closeSheet(); render(); }); },
  'tpl-delete': function(){ var id=ui.sheet.id; confirmSheet({title:'Delete this saved workout?', msg:'Logged workouts stay in your history.', ok:'Delete', danger:true}, function(){
    state.templates=state.templates.filter(function(t){return t.id!==id;}); save(); render(); }); },
  /* exercises */
  'ex-open': function(el){ push({v:'exercise', ex:el.dataset.ex}); },
  'fav': function(el){ var ex=el.dataset.ex, i=state.favs.indexOf(ex);
    if(i>-1) state.favs.splice(i,1);
    else { if(state.favs.length>=MAX_FAVS){ toast('You can favourite up to '+MAX_FAVS+' – unstar one first'); return; } state.favs.push(ex); toast('Added to Records'); }
    save(); var y=window.scrollY; render(); window.scrollTo(0,y); },
  /* settings */
  'unit': function(el){ state.unit=el.dataset.u; save(); render(); },
  'export': function(){ exportData(); },
  'copy': function(){ var data=JSON.stringify(state);
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(data).then(function(){toast('Backup copied – paste it into Notes');},function(){toast('Copy failed');});
    else toast('Clipboard not available'); },
  'import': function(){ openSheet({type:'importtext'}); },
  'import-file': function(){ var f=document.getElementById('import-file'); if(f) f.click(); },
  'import-paste': function(){ var t=document.getElementById('import-text'); if(t&&t.value.trim()) importData(t.value.trim()); },
  'wipe': function(){ confirmSheet({title:'Delete all data?', msg:'Every workout, template and favourite on this device will be erased. Export a backup first if you might want it.', ok:'Delete everything', danger:true}, function(){
    state=blankState(); save(); home('calendar'); toast('All data deleted'); }); }
};

var INPUTS = {
  'set': function(el){
    var t=top(), s=slotOf(getW(t.id),t.slot), i=+el.dataset.i, st=s&&s.sets[i]; if(!st) return;
    st[el.dataset.k]=el.value; queueSave();
    var m=metricOf(s.ex,s.cat), d=document.getElementById('drv-'+i); if(d) d.innerHTML=derived(st,m);
    var sn=document.getElementById('sn-'+i); if(sn) sn.classList.toggle('f', filled(st));
  },
  'note': function(el){ var t=top(), s=slotOf(getW(t.id),t.slot); if(s){ s.note=el.value; queueSave(); } },
  'ex-q': function(el){
    ui.exQuery=el.value; var q=el.value.trim().toLowerCase();
    app.querySelectorAll('.exrow').forEach(function(r){ r.hidden=!!q&&r.dataset.name.indexOf(q)<0; });
    app.querySelectorAll('.exgroup').forEach(function(g){ g.hidden=!g.querySelector('.exrow:not([hidden])'); });
  },
  'pick-q': function(el){ var q=el.value.trim().toLowerCase();
    sheetRoot.querySelectorAll('.pickrow').forEach(function(r){ r.hidden=!!q&&r.dataset.name.indexOf(q)<0; }); }
};
var CHANGES = {
  'setup-date': function(el){ if(el.value) ui.draft.date=el.value; },
  'wk-date': function(el){ var w=getW(ui.sheet.id); if(w&&el.value){ w.date=el.value; save(); render(); } },
  'import-file': function(el){ var f=el.files&&el.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ importData(String(r.result)); }; r.readAsText(f); el.value=''; }
};

document.addEventListener('click', function(e){
  var el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  var fn=A[el.dataset.a]; if(fn){ e.preventDefault(); fn(el,e); }
});
document.addEventListener('input', function(e){ var el=e.target.closest('[data-in]'); if(el&&INPUTS[el.dataset.in]) INPUTS[el.dataset.in](el,e); });
document.addEventListener('change', function(e){ var el=e.target.closest('[data-ch]'); if(el&&CHANGES[el.dataset.ch]) CHANGES[el.dataset.ch](el,e); });
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter') return; var el=e.target.closest('[data-enter]'); if(el){ e.preventDefault(); A[el.dataset.enter](el,e); }
});

render();
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
})();
</script>
